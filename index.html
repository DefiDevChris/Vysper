<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vysper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: rgba(15, 15, 20, 0.95);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 280px;
      background: rgba(0, 0, 0, 0.3);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-icon {
      width: 28px; height: 28px;
      background: #3b82f6;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .brand-text { font-size: 16px; font-weight: 600; }
    .skill-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.3);
    }
    .btn.primary {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.4);
    }
    .btn.primary:hover {
      background: rgba(59, 130, 246, 0.4);
    }
    .btn-key {
      min-width: 32px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }
    .btn-text { flex: 1; }
    .status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .status.active { background: #3b82f6; }
    .status.typing { background: #f97316; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header h3 { font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.6); }
    .queue-info {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    .thumbnails {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 80px;
    }
    .thumb {
      width: 120px;
      height: 80px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .remove {
      position: absolute;
      top: 4px; right: 4px;
      width: 18px; height: 18px;
      background: rgba(239, 68, 68, 0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .thumb:hover .remove { opacity: 1; }

    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 8px;
    }
    .msg {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: rgba(59, 130, 246, 0.2); }
    .msg.assistant { 
      align-self: flex-start; 
      background: rgba(255, 255, 255, 0.08); 
      max-width: 95%;
    }
    .msg.system { 
      align-self: center; 
      font-size: 11px; 
      color: rgba(255, 255, 255, 0.6); 
      padding: 4px 12px;
      background: rgba(255, 200, 50, 0.15);
      border-radius: 6px;
    }
    .msg pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 100%;
    }
    .msg code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      color: #64ffda;
      font-size: 12px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .input-area input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .input-area button {
      padding: 10px 18px;
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .loading {
      display: flex;
      gap: 4px;
      padding: 8px;
    }
    .loading span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: bounce 1.2s infinite;
    }
    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon">V</div>
        <div class="brand-text">Vysper</div>
      </div>

      <select class="skill-select" id="skillSelect">
        <option value="general">General</option>
        <option value="dsa">DSA / Coding</option>
        <option value="system-design">System Design</option>
        <option value="behavioral">Behavioral</option>
        <option value="data-science">Data Science</option>
      </select>

      <select class="skill-select" id="screenSelect">
        <option value="">Loading screens...</option>
      </select>
      <button class="btn" id="refreshScreensBtn" style="margin-top: -8px; font-size: 11px; padding: 6px;">Refresh Screens</button>

      <div class="actions">
        <button class="btn primary" id="captureBtn">
          <span class="btn-key">F6</span>
          <span class="btn-text">Capture Screen</span>
          <span class="status" id="captureStatus"></span>
        </button>
        <button class="btn" id="analyzeBtn">
          <span class="btn-key">F7</span>
          <span class="btn-text">Analyze</span>
          <span class="status" id="analyzeStatus"></span>
        </button>
        <button class="btn" id="typeBtn">
          <span class="btn-key">F8</span>
          <span class="btn-text">Type Answer</span>
          <span class="status" id="typeStatus"></span>
        </button>
        <button class="btn" id="cancelBtn">
          <span class="btn-key">F9</span>
          <span class="btn-text">Cancel</span>
          <span class="status" id="cancelStatus"></span>
        </button>
        <button class="btn" id="clearBtn" style="margin-top: 8px;">
          <span class="btn-key">F10</span>
          <span class="btn-text">Clear Memory</span>
        </button>
      </div>
    </div>

    <div class="main">
      <div class="header">
        <h3>Captured Screens</h3>
        <span class="queue-info" id="queueInfo">0 images</span>
      </div>
      <div class="thumbnails" id="thumbnails"></div>
      <div class="chat" id="chat"></div>
      <div class="input-area">
        <input type="text" id="textInput" placeholder="Ask a question...">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="src/ui/main-window.js"></script>
</body>
</html>
