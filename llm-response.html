<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vysper Response</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: rgba(10, 10, 15, 0.92);
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 16px;
      }

      .header h2 { font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, 0.7); }
      .header .skill { font-size: 12px; color: rgba(255, 255, 255, 0.4); }

      .response-container {
        flex: 1;
        overflow-y: auto;
        padding-right: 8px;
      }

      .response-content {
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .response-content pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 12px 0;
        font-size: 13px;
      }

      .response-content code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Monaco', 'Menlo', monospace;
        color: #64ffda;
        font-size: 13px;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
      }

      .loading span { animation: bounce 1.2s infinite; }
      .loading span:nth-child(2) { animation-delay: 0.15s; }
      .loading span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce {
        0%, 80%, 100% { opacity: 0.4; }
        40% { opacity: 1; }
      }

      .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: rgba(255, 255, 255, 0.2);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Vysper Response</h2>
      <span class="skill" id="skillLabel">general</span>
    </div>
    <div class="response-container" id="responseContainer">
      <div class="empty-state">Send a screenshot to see the response here</div>
    </div>

    <script>
      const container = document.getElementById('responseContainer');
      const skillLabel = document.getElementById('skillLabel');

      if (window.electronAPI) {
        window.electronAPI.onLlmResponse((_, data) => {
          if (data?.response) showResponse(data.response, data.skill);
        });
        window.electronAPI.onSkillChanged((_, data) => {
          if (data?.skill) skillLabel.textContent = data.skill;
        });
      }

      function showResponse(text, skill) {
        if (skill) skillLabel.textContent = skill;
        // clear previous
        container.innerHTML = '';
        const content = document.createElement('div');
        content.className = 'response-content';
        content.innerHTML = formatResponse(text);
        container.appendChild(content);
      }

      function formatResponse(text) {
        // Simple markdown-like formatting
        return text
          .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
      }
    </script>
  </body>
</html>
